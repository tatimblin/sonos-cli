name: CI
# Runs fmt, clippy, and tests on every PR and push to main

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # --features test-helpers is required: the SDK's offline/in-memory
        # constructors sit behind it, and without it 22 existing tests plus the
        # whole tests/liveness.rs target compile out and silently never run.
        run: cargo test --features test-helpers
